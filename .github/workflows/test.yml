name: Test backend

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:17-3.6
        env:
          POSTGRES_DB: kazan_events_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d kazan_events_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install application and test dependencies
        run: python -m pip install ".[test]"

      - name: Check code style
        run: |
          python -m ruff check app
          python -m ruff format --check app

      - name: Run unit, integration, dump/restore and scale tests
        env:
          PG_HOST: 127.0.0.1
          PG_PORT: ${{ job.services.postgres.ports[5432] }}
          PG_DB_NAME: kazan_events_test
          PG_USER_NAME: postgres
          PG_USER_PASSWORD: test-password
          TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: python -m pytest -q
